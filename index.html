<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Тренажёр Brawl English — мобильная версия</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Lilita One', cursive;
            background-color: #3b0a6b; /* резервный цвет, если картинка не загрузится */
            background-image: url('https://i.pinimg.com/736x/cd/56/9b/cd569b65ab307352e0385e68f6b84eaf.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: scroll; /* на мобильных fixed может давать сбои */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }

        .container {
            max-width: 700px;
            width: calc(100% - 30px); /* отступы по краям экрана */
            background: rgba(20, 10, 50, 0.75);
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(255, 200, 0, 0.4);
            padding: 25px 15px;
            border: 4px solid #ffcc00;
            animation: floatIn 0.8s ease;
            margin: auto;
        }

        @keyframes floatIn {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes chestOpen {
            0% { transform: scale(0.7) rotate(-3deg); opacity: 0; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1) rotate(0); }
        }

        h1 {
            text-align: center;
            color: #ffcc00;
            font-size: 2rem; /* адаптивный размер */
            text-shadow: 2px 2px 0 #8b5cf6, 4px 4px 0 #4a0072;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #ffe082;
            font-size: 1rem;
            margin-bottom: 20px;
            background: rgba(138, 43, 226, 0.6);
            padding: 6px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
            width: fit-content;
            border: 2px solid #ffaa00;
            box-shadow: 0 4px 0 #4a0072;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 20px;
            background: rgba(255, 215, 0, 0.15);
            padding: 20px 10px;
            border-radius: 30px;
            border: 2px dashed #ffcc00;
        }

        .welcome-section .hint {
            color: #ffecb3;
            font-size: 1rem;
            margin-bottom: 12px;
            text-shadow: 1px 1px 0 #4a148c;
        }

        .welcome-section input {
            padding: 12px 15px;
            border: 3px solid #ffcc00;
            border-radius: 30px;
            font-size: 1rem;
            width: 80%;
            max-width: 250px;
            text-align: center;
            background: #4a148c;
            color: #ffd700;
            font-family: 'Lilita One', cursive;
            outline: none;
            margin-bottom: 15px;
        }

        .welcome-section input:focus {
            border-color: #ffaa00;
            background: #6a1b9a;
        }

        .start-btn {
            background: linear-gradient(180deg, #ffcc00, #ff9900);
            border: none;
            color: #3e1f00;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b35900;
            font-family: 'Lilita One', cursive;
            text-transform: uppercase;
            transition: 0.2s;
            margin-top: 5px;
        }

        .start-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b35900;
        }

        .greeting {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
            margin: 15px 0;
            display: none;
            text-align: center;
            text-shadow: 2px 2px 0 #4a0072;
        }

        .main-content { display: none; }

        .progress {
            text-align: center;
            color: #ffe082;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .question-screen {
            background: #7b1fa2;
            border-radius: 25px;
            padding: 20px 15px;
            border: 3px solid #ffb300;
            box-shadow: 0 6px 0 #4a148c;
            margin: 0 auto 15px;
            max-width: 500px;
            width: 100%;
            transition: 0.3s;
        }

        .question-screen.animate-question {
            animation: chestOpen 0.4s ease;
        }

        .question-screen.correct-highlight {
            background: #2e7d32;
            border-color: #8bc34a;
            box-shadow: 0 0 20px #8bc34a;
        }

        .question-screen.wrong-highlight {
            background: #b71c1c;
            border-color: #ff5252;
            box-shadow: 0 0 20px #ff1744;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: white;
            text-shadow: 1px 1px 0 #000;
            text-align: center;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .options label {
            background: #ffd54f;
            padding: 10px 15px;
            border-radius: 20px;
            border: 2px solid #ff6f00;
            cursor: pointer;
            font-size: 1rem;
            color: #3e1f00;
            text-shadow: 1px 1px 0 white;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0 #bf360c;
            transition: 0.2s;
        }

        .options label:hover { background: #ffecb3; }
        .options label.disabled { pointer-events: none; opacity: 0.7; }
        .options input[type="radio"] { accent-color: #ff6d00; width: 18px; height: 18px; }

        .feedback {
            margin-top: 12px;
            display: none;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 15px;
            color: white;
            font-size: 0.9rem;
            text-align: center;
        }

        .question-screen.wrong-highlight .feedback,
        .question-screen.correct-highlight .feedback { display: block; }

        .correct-answer-text { color: #b9f6ca; }
        .explanation-text { color: #ffcdd2; margin-top: 4px; }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(180deg, #ffcc00, #ff9900);
            border: none;
            color: #3e1f00;
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 0 #b35900;
            font-family: 'Lilita One', cursive;
            text-transform: uppercase;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b35900; }
        .btn:disabled { opacity: 0.5; transform: none; box-shadow: 0 4px 0 #7a4a00; }
        .btn.check-btn { background: linear-gradient(180deg, #7c4dff, #651fff); color: white; }
        .btn.reset-btn { background: linear-gradient(180deg, #9575cd, #512da8); color: white; }

        .result {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
            background: #4a148c;
            padding: 12px 20px;
            border-radius: 25px;
            display: inline-block;
            margin: 10px auto;
            box-shadow: 0 5px 0 #2e0b5e;
        }

        .result-message { font-size: 1rem; color: #ffcc00; margin-top: 8px; text-align: center; }

        .reading-task {
            background: #ffb300;
            border: 4px solid #ff6f00;
            border-radius: 25px;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
            box-shadow: 0 8px 0 #bf360c;
            color: #3e1f00;
        }

        .reading-task h2 { font-size: 1.2rem; color: #4a148c; text-shadow: 1px 1px 0 white; }
        .reading-text {
            background: #fff9c4;
            padding: 15px;
            border-radius: 20px;
            display: inline-block;
            text-align: left;
            margin: 10px auto;
            font-size: 0.9rem;
            max-width: 100%;
        }

        .no-grade { font-style: italic; color: #4e342e; margin-top: 8px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>
    <div class="container">
        <h1>🐨 Brawl English</h1>
        <div class="subtitle">2 класс • Rainbow English • Alla.pro_english</div>

        <div class="welcome-section" id="welcomeSection">
            <p class="hint">⚡ Введи имя на английском ⚡</p>
            <input type="text" id="nameInput" placeholder="Твой ник, боец!" autocomplete="off">
            <button class="start-btn" id="startBtn">▶ В БОЙ!</button>
        </div>

        <div class="greeting" id="greeting"></div>

        <div class="main-content" id="mainContent">
            <div class="progress"><span id="questionCounter">Вопрос 1 из 20</span></div>
            <div class="question-screen" id="questionScreen">
                <div class="question-text" id="questionText"></div>
                <div class="options" id="optionsContainer"></div>
                <div class="feedback" id="feedbackBox">
                    <span class="correct-answer-text"></span><br>
                    <span class="explanation-text"></span>
                </div>
            </div>
            <div class="nav-buttons">
                <button class="btn" id="prevBtn" disabled>◀ Назад</button>
                <button class="btn" id="nextBtn">Вперёд ▶</button>
                <button class="btn check-btn" id="checkBtnFinal" style="display:none;">✅ Подвести итог</button>
            </div>
            <div class="nav-buttons">
                <button class="btn reset-btn" id="resetBtn">🔄 Заново</button>
            </div>
            <div style="text-align:center;">
                <span class="result" id="resultDisplay" style="display:none;"></span>
            </div>
            <div class="result-message" id="resultMessage"></div>
            <div class="reading-task" id="readingTask">
                <h2>📖 Задание 21. Прочитай вслух!</h2>
                <div class="reading-text" id="readingText"></div>
                <p class="no-grade">⭐ Это задание не оценивается — просто веселье!</p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ... (весь JavaScript без изменений, включая 6 вариантов, 
            // функции рендера, анимации, фейерверк, проверку,

            // renderQuestion, showResults, startQuiz и т.д.
            // Если нужно, я пришлю отдельно только JS-часть.
        })();
    </script>
</body>
</html>
